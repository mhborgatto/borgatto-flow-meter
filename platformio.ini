; Compilação com PlatformIO (dependências automáticas).
; Na raiz: pio run -e nodemcuv2
;
; Arduino IDE: instale manualmente a biblioteca ThingPulse (secção 11 da DOCUMENTACAO.md).

[platformio]
src_dir = FlowMeter

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager@^2.0.17
  https://github.com/ThingPulse/esp8266-oled-ssd1306.git#4.6.2
